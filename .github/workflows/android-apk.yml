name: Gerar APK Android Assinado

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Capacitor
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core @capacitor/android @capacitor/cli
          mkdir -p www
          echo '<html><body>Lord do Açaí</body></html>' > www/index.html
          npx cap add android

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lord-do-acai-release.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("android/keystore.properties")
          p.write_text(
              "storeFile=" + os.environ["RUNNER_TEMP"] + "/lord-do-acai-release.jks\n" +
              "storePassword=" + os.environ["KEYSTORE_PASSWORD"] + "\n" +
              "keyAlias=" + os.environ["KEY_ALIAS"] + "\n" +
              "keyPassword=" + os.environ["KEY_PASSWORD"] + "\n"
          )
          p.chmod(0o600)

          gradle = Path("android/app/build.gradle")
          s = gradle.read_text()
          loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
          if "def keystoreProperties =" not in s:
              s = loader + s
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

          '''
          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in s:
              import re
              s, count = re.subn(
                  r'(buildTypes\\s*\\{\\s*release\\s*\\{)',
                  r'\\1\n            signingConfig signingConfigs.release',
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Não foi possível configurar a assinatura.")
          gradle.write_text(s)
          PY

      - name: Gerar APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Disponibilizar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Lord-do-Acai-APK-ASSINADO
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
