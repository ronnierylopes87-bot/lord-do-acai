<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lord do Açaí</title>
<style>
:root{--p:#64208c;--pink:#ed4caa}*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#faf7fc;color:#25152d}header{background:linear-gradient(120deg,var(--p),var(--pink));color:white;padding:28px 18px;text-align:center}main{max-width:850px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.product{border:1px solid #eee;border-radius:12px;padding:15px}.price{font-weight:bold;color:var(--p)}button{background:var(--p);color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}label{font-weight:bold}small{color:#666}
</style></head><body>
<header><h1>Lord do Açaí</h1><img src="a_vibrant_promotional_food_advertisement_graphic_i.png" alt="Lord do Açaí" style="width:100%;max-width:900px;display:block;margin:20px auto;border-radius:16px;"><p>Açaí e bolo no pote • Entrega grátis em Olho d'Água das Cunhãs – MA</p></header>
<main><section class="card"><h2>Nosso cardápio</h2><div id="products" class="products">Carregando produtos...</div></section>
<section class="card"><h2>Seu pedido</h2><div id="cart">Nenhum item adicionado.</div><form id="checkout">
<label>Seu nome</label><input name="customer_name" required>
<label>WhatsApp</label><input name="phone" required placeholder="(98) 99999-9999">
<label>Endereço de entrega</label><input name="address" required>
<label>Pagamento</label><select name="payment_method" required><option value="Pix antecipado">Pix antecipado</option><option value="Dinheiro na entrega">Dinheiro na entrega</option><option value="Cartão na entrega">Cartão na entrega</option></select>
<button type="submit">Enviar pedido</button><p><small>Pix antecipado: lorddoacaiodc@gmail.com. Envie o comprovante pelo WhatsApp após concluir.</small></p>
</form><p id="msg"></p></section></main>
<script>
const cart=[];
let products=[];

const money=n=>Number(n).toLocaleString('pt-BR',{
  style:'currency',
  currency:'BRL'
});

function draw(){
  document.querySelector('#products').innerHTML=products.map(p=>`
    <div class="product">
      ${p.name.toLowerCase().includes('açaí')
        ? '<img src="acai-garrafa.png" alt="Açaí na garrafa" style="width:100%;height:190px;object-fit:cover;border-radius:10px;">'
        : p.name.toLowerCase().includes('bolo')
        ? '<img src="bolo-no-pote.png" alt="Bolo no Pote" style="width:100%;height:190px;object-fit:cover;border-radius:10px;">'
        : ''}
      <h3>${p.name}</h3>
      <p class="price">${money(p.price)}</p>

      ${p.name.toLowerCase().includes('bolo') ? `
        <label>Escolha o sabor:</label>
        <select id="sabor-${p.id}">
          <option value="">Selecione</option>
          <option value="Chocolate">Chocolate</option>
          <option value="Ninho">Ninho</option>
          <option value="Prestígio">Prestígio</option>
        </select>
      ` : ''}

      <button type="button" onclick="add('${p.id}')">Adicionar</button>
    </div>
  `).join('') || 'Nenhum produto disponível.';

  document.querySelector('#cart').innerHTML=cart.length
    ? cart.map(x=>`${x.name}${x.flavor?' - '+x.flavor:''} × ${x.quantity} — ${money(x.price*x.quantity)}`).join('<br>')+
      '<hr><b>Total: '+money(cart.reduce((s,x)=>s+x.price*x.quantity,0))+'</b>'
    : 'Nenhum item adicionado.';
}

function add(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;

  let flavor='';

  if(p.name.toLowerCase().includes('bolo')){
    const select=document.querySelector('#sabor-'+p.id);
    flavor=select ? select.value : '';

    if(!flavor){
      alert('Escolha o sabor do Bolo no Pote.');
      return;
    }
  }

  const i=cart.find(x=>
    String(x.id)===String(id) && x.flavor===flavor
  );

  if(i){
    i.quantity++;
  }else{
    cart.push({
      id:p.id,
      name:p.name,
      price:Number(p.price),
      quantity:1,
      flavor
    });
  }

  draw();
}

async function load(){
  try{
    const r=await fetch('/.netlify/functions/products');
    const j=await r.json();
    products=j.products||[];
  }catch(e){
    products=[];
  }
  draw();
}

document.querySelector('#checkout').addEventListener('submit',async e=>{
  e.preventDefault();

  if(!cart.length){
    alert('Adicione um produto.');
    return;
  }

  const f=new FormData(e.target);

  const body={
    customer_name:f.get('customer_name'),
    phone:f.get('phone'),
    address:f.get('address'),
    payment_method:f.get('payment_method'),
    items:cart.map(x=>({
      product_id:x.id,
      quantity:x.quantity,
      flavor:x.flavor
    }))
  };

  const m=document.querySelector('#msg');
  m.textContent='Enviando pedido...';

  try{
    const r=await fetch('/.netlify/functions/create-order',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });

    const j=await r.json();

    if(!r.ok)throw Error(j.error||'Não foi possível enviar');

    m.textContent='Pedido recebido! Número: '+j.order_id+'. Confirme pelo WhatsApp.';

    const resumo=cart.map(x=>
      `${x.name}${x.flavor?' - '+x.flavor:''} x ${x.quantity}`
    ).join(', ');

    const text=encodeURIComponent(
      `Olá, fiz o pedido ${j.order_id} na Lord do Açaí. Nome: ${body.customer_name}. Itens: ${resumo}. Pagamento: ${body.payment_method}.`
    );

    window.open('https://wa.me/5598981221085?text='+text,'_blank');

    cart.length=0;
    draw();
    e.target.reset();

  }catch(err){
    m.textContent='Erro: '+err.message;
  }
});

load();
</script>
</body></html>
